<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentum</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="theme-color" content="#0F1319">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230F1319' width='180' height='180'/><circle cx='90' cy='90' r='40' fill='%23F2B84B'/></svg>">
<style>
  :root{
    --bg:#0F1319;
    --ambient-1:#171D27;
    --ambient-2:#0B0E13;
    --surface:#1B212C;
    --surface-2:#242C39;
    --surface-3:#2E3746;
    --text:#EDEFF3;
    --text-muted:#8993A3;
    --text-faint:#5A6478;
    --accent:#F2B84B;
    --accent-dim:#4A3F26;
    --accent-2:#5FD0A0;
    --locked:#333B49;
    --border:#2A3240;
    --danger:#E8785A;
    --on-accent:#14181F;
  }
  :root[data-mode="light"]{
    --bg:#F7F5F1;
    --ambient-1:#FFFFFF;
    --ambient-2:#EDEAE3;
    --surface:#FFFFFF;
    --surface-2:#F1EEE7;
    --surface-3:#E7E2D7;
    --text:#1B1D22;
    --text-muted:#666B76;
    --text-faint:#9B9FA8;
    --accent:#C4881A;
    --accent-dim:#F3E3C0;
    --locked:#DAD5C9;
    --border:#E4E0D6;
    --danger:#C1523A;
  }
  :root[data-accent="ocean"]{ --accent:#3FA0E0; --accent-2:#54B8A8; --accent-dim:#1F3A4A; }
  :root[data-mode="light"][data-accent="ocean"]{ --accent:#1F7FBE; --accent-dim:#D9EEFB; }
  :root[data-accent="forest"]{ --accent:#7FD858; --accent-2:#3FA76B; --accent-dim:#22301C; }
  :root[data-mode="light"][data-accent="forest"]{ --accent:#3E8C2C; --accent-dim:#E1F3D8; }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 30% 0%, var(--ambient-1), var(--ambient-2) 70%);
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:28px 12px;
    transition:background .2s;
  }
  .frame{
    width:390px;
    max-width:100%;
    background:var(--bg);
    border-radius:28px;
    border:1px solid var(--border);
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:760px;
    transition:background .2s;
  }
  header{
    padding:22px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .brand{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);}
  .header-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);background:var(--surface);
    cursor:pointer;font-size:13.5px;
  }
  .plan-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    padding:5px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-muted);
    cursor:pointer;
    background:var(--surface);
    text-transform:uppercase;
  }
  .plan-badge.pro{color:var(--on-accent);background:var(--accent);border-color:var(--accent);font-weight:600;}

  main{flex:1;overflow-y:auto;padding:18px 20px 12px;}
  main::-webkit-scrollbar{display:none;}

  .tabs{
    display:flex;
    border-top:1px solid var(--border);
    background:var(--surface);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:13px 0 15px;
    font-size:12px;
    color:var(--text-faint);
    cursor:pointer;
    font-weight:500;
    letter-spacing:0.01em;
    border-top:2px solid transparent;
    transition:color .15s;
  }
  .tab.active{color:var(--accent);border-top-color:var(--accent);}

  h2.section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:600;
    margin:4px 0 14px;
    color:var(--text);
  }
  h3.subsection-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    margin:18px 0 10px;
    color:var(--text);
  }

  .score-card{
    background:linear-gradient(145deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .score-card .label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;}
  .score-card .value{
    font-family:'Space Grotesk',sans-serif;
    font-size:44px;
    font-weight:700;
    margin-top:4px;
    color:var(--accent);
    display:flex;align-items:baseline;gap:6px;
  }
  .score-card .value span{font-size:16px;color:var(--text-muted);font-weight:500;}
  .score-card .sub{margin-top:8px;font-size:12.5px;color:var(--text-muted);}

  .habit-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 14px;
    margin-bottom:10px;
  }
  .habit-row.inactive{opacity:.45;}
  .check{
    width:26px;height:26px;border-radius:50%;
    border:2px solid var(--text-faint);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:.15s;
  }
  .check.done{background:var(--accent-2);border-color:var(--accent-2);}
  .check.done::after{content:'✓';font-size:13px;color:#0F1319;font-weight:700;}
  .habit-info{flex:1;min-width:0;}
  .habit-name{font-size:14px;font-weight:500;}
  .habit-meta{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit-emoji{font-size:19px;width:22px;text-align:center;flex-shrink:0;}
  .bell-btn{width:20px;text-align:center;font-size:13px;opacity:.65;cursor:pointer;flex-shrink:0;}

  .add-habit-btn{
    width:100%;
    padding:13px;
    border-radius:14px;
    border:1.5px dashed var(--border);
    background:none;
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    margin-top:4px;
    font-family:'Inter',sans-serif;
  }
  .add-habit-btn:hover{border-color:var(--accent);color:var(--accent);}

  .range-select{display:flex;gap:6px;margin-bottom:16px;}
  .range-pill{
    flex:1;text-align:center;padding:8px 0;
    border-radius:10px;font-size:12px;font-weight:500;
    border:1px solid var(--border);color:var(--text-muted);cursor:pointer;
    position:relative;
  }
  .range-pill.active{background:var(--surface-3);color:var(--text);border-color:var(--accent);}
  .range-pill .lock-mark{font-size:9px;margin-left:3px;opacity:.7;}

  .banner{
    background:linear-gradient(135deg, var(--accent-dim), var(--surface));
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 16px 15px;
    margin-bottom:16px;
  }
  .banner .head{font-size:13px;color:var(--text-muted);margin-bottom:6px;}
  .banner .lockline{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15.5px;color:var(--accent);margin-bottom:6px;}
  .banner p{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin:0 0 12px;}
  .banner button{
    background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:9px 16px;font-weight:600;font-size:12.5px;cursor:pointer;
  }

  .grid-wrap{margin-bottom:6px;}
  .grid-label{font-size:11px;color:var(--text-faint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;}
  .cellgrid{display:grid;gap:4px;margin-bottom:16px;}
  .cell{
    aspect-ratio:1;
    border-radius:4px;
    background:var(--surface-2);
    position:relative;
  }
  .cell.locked{
    background:repeating-linear-gradient(135deg, var(--locked), var(--locked) 3px, var(--surface-2) 3px, var(--surface-2) 6px);
  }
  .locked-overlay{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    padding:14px 14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    text-align:center;
    margin-bottom:8px;
  }
  .locked-overlay .lock-icon{font-size:20px;margin-bottom:8px;display:block;}
  .locked-overlay .h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;margin-bottom:5px;}
  .locked-overlay p{font-size:12px;color:var(--text-muted);margin:0 0 12px;line-height:1.5;}
  .locked-overlay button{
    background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;
    padding:9px 18px;font-weight:600;font-size:12.5px;cursor:pointer;
  }

  .stats-row{display:flex;gap:10px;margin-top:14px;}
  .stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .stat-box .n{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;color:var(--text);}
  .stat-box .l{font-size:10.5px;color:var(--text-muted);margin-top:3px;}

  .pricing-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;
  }
  .pricing-card.best{border-color:var(--accent);background:linear-gradient(135deg, var(--accent-dim), var(--surface));}
  .pricing-card.selected{border-color:var(--accent);}
  .pricing-card .ptitle{font-weight:600;font-size:14px;}
  .pricing-card .pdesc{font-size:11.5px;color:var(--text-muted);margin-top:3px;}
  .pricing-card .price{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--accent);text-align:right;}
  .pricing-card .price small{display:block;font-size:10px;color:var(--text-muted);font-weight:400;}
  .badge-best{font-size:9.5px;background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.03em;margin-left:6px;}
  .swatch{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid transparent;}

  .feature-list{list-style:none;padding:0;margin:0 0 6px;}
  .feature-list li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text-muted);padding:6px 0;}
  .feature-list li::before{content:'✓';color:var(--accent-2);font-weight:700;flex-shrink:0;}

  .restore-link{
    display:block;width:100%;text-align:center;background:none;border:none;
    color:var(--text-muted);font-size:12px;padding:12px 0 4px;cursor:pointer;
    text-decoration:underline;font-family:'Inter',sans-serif;
  }

  .dev-toggle{
    margin-top:20px;padding-top:16px;border-top:1px dashed var(--border);
    font-size:11px;color:var(--text-faint);
  }
  .dev-toggle .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .switch{width:38px;height:21px;border-radius:20px;background:var(--surface-3);position:relative;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent);}
  .switch::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2.5px;left:3px;transition:.15s;}
  .switch.on::after{left:19px;}

  .modal-backdrop{
    position:absolute;inset:0;background:rgba(10,12,16,0.75);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
    backdrop-filter:blur(2px);
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--border);
    border-radius:20px 20px 0 0;
    width:100%;padding:24px 22px 26px;
    animation:slideup .2s ease-out;
    max-height:85vh;overflow-y:auto;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal .lock-icon{font-size:22px;}
  .modal h3{font-family:'Space Grotesk',sans-serif;font-size:17px;margin:10px 0 8px;}
  .modal p{font-size:13px;color:var(--text-muted);line-height:1.55;margin:0 0 18px;}
  .modal .btn-row{display:flex;gap:10px;}
  .modal button.primary{
    flex:1;background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;
    padding:13px;font-weight:600;font-size:13.5px;cursor:pointer;
  }
  .modal button.secondary{
    background:none;border:1px solid var(--border);color:var(--text-muted);
    border-radius:12px;padding:13px 16px;font-size:13.5px;cursor:pointer;
  }

  .frame-outer{position:relative;}
  .loading-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--accent-dim);border-top-color:var(--accent);border-radius:50%;animation:spin 0.6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="frame-outer">
<div class="frame" id="frame">

  <header>
    <div class="brand"><span class="dot"></span>Momentum</div>
    <div class="header-actions">
      <div class="icon-btn" id="modeToggle" onclick="toggleMode()" title="Toggle light / dark mode">🌙</div>
      <div class="plan-badge" id="planBadge" onclick="goto('upgrade')">FREE</div>
    </div>
  </header>

  <main id="main"><div style="display:flex;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--text-muted);"><div class="loading-spinner"></div> Loading...</div></main>

  <div class="tabs">
    <div class="tab" data-tab="today" onclick="goto('today')">Today</div>
    <div class="tab" data-tab="map" onclick="goto('map')">Momentum Map</div>
    <div class="tab" data-tab="upgrade" onclick="goto('upgrade')">Pro</div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ SUPABASE SETUP — replace these with your actual keys ============ */
const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oTkiUQF3m9OquAlvKDrFjw_bmS_UX2Y';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUserId = null;

/* ============ SERVICE WORKER REGISTRATION ============ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
}

/* ============ CENTRAL CONFIG ============ */
const CONFIG = {
  entitlementKey: 'momentum_pro',
  limits: { freeMaxHabits: 3, freeHistoryDays: 14 },
  pricing: {
    monthly: { price: 2.99, label: 'Monthly', desc: 'Billed every month' },
    annual:  { price: 19.99, label: 'Annual', desc: 'Just $1.67/mo, billed yearly', best: true },
    lifetime:{ price: 29.99, label: 'Lifetime', desc: 'One payment, yours forever' }
  },
  themes: {
    default: { name:'Amber (default)', swatch:'#F2B84B', free:true },
    ocean:   { name:'Ocean',            swatch:'#3FA0E0', free:false },
    forest:  { name:'Forest',           swatch:'#7FD858', free:false }
  },
  triggerCooldownHours: 24,
  conversionNudgeAfterDays: 12
};

/* ============ STORAGE HELPERS — now backed by Supabase ============ */
async function sget(key){
  if (!currentUserId) return null;
  try{
    const { data, error } = await supabase
      .from('user_state')
      .select('state')
      .eq('user_id', currentUserId)
      .single();
    if (error) throw error;
    return data ? data.state[key] : null;
  } catch (e) { console.warn('sget failed', e); return null; }
}

async function sset(key, val){
  if (!currentUserId) return;
  try{
    const { data } = await supabase
      .from('user_state')
      .select('state')
      .eq('user_id', currentUserId)
      .single();

    const currentState = data?.state || {};
    currentState[key] = val;

    await supabase
      .from('user_state')
      .upsert({ user_id: currentUserId, state: currentState, updated_at: new Date() })
      .eq('user_id', currentUserId);
  } catch (e) { console.warn('sset failed', e); }
}

async function trackEvent(event, properties = {}){
  if (!currentUserId) return;
  try{
    await supabase.from('events').insert([{
      user_id: currentUserId,
      event,
      properties
    }]);
  } catch (e) { console.warn('track failed', e); }
}

let STATE = { habits: [], checkins: {}, entitlement: 'free', accountStart: null, triggerLog: {}, mode:'dark', accentTheme:'default', reminders:{} };
let currentTab = 'today';
let currentRange = 14;

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }

function fmtDate(d){ return d.toISOString().slice(0,10); }
function daysAgo(n){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d; }

async function initState(){
  try{
    const { data, error } = await supabase.auth.signInAnonymously();
    if (error) throw error;
    currentUserId = data.session.user.id;
  } catch (e) {
    console.error('Auth failed:', e);
    document.getElementById('main').innerHTML = '<div style="padding:20px;color:var(--text-muted);"><p>❌ Couldn\'t connect to cloud. Check your Supabase keys in the script.</p></div>';
    return;
  }

  try{
    const { data } = await supabase
      .from('user_state')
      .select('state')
      .eq('user_id', currentUserId)
      .single();

    if (data) {
      STATE = Object.assign({ mode:'dark', accentTheme:'default', reminders:{}, triggerLog:{} }, data.state);
      return;
    }
  } catch (e) { console.log('No prior state, seeding...'); }

  const start = daysAgo(47);
  const rand = mulberry32(42);
  const habits = [
    { id:'h1', name:'Morning run', emoji:'🏃', createdDaysAgo:47 },
    { id:'h2', name:'Read 20 pages', emoji:'📖', createdDaysAgo:47 },
    { id:'h3', name:'No phone before bed', emoji:'🌙', createdDaysAgo:40 },
  ];
  const checkins = {};
  habits.forEach(h => checkins[h.id] = {});
  for(let i=47;i>=1;i--){
    const date = fmtDate(daysAgo(i));
    habits.forEach(h=>{
      if(i <= h.createdDaysAgo){
        const progress = 1 - (i/47);
        const p = 0.35 + progress*0.5;
        if(rand() < p) checkins[h.id][date] = true;
      }
    });
  }
  STATE = {
    habits, checkins, entitlement:'free',
    accountStart: fmtDate(start),
    triggerLog: {},
    mode:'dark', accentTheme:'default',
    reminders: { h1:'06:30' }
  };
  await persist();
  await trackEvent('user_created', { accountStart: STATE.accountStart });
}

async function persist(){ await sset('app_state_v1', STATE); }

function isPro(){ return STATE.entitlement === 'pro'; }
async function setEntitlement(val){ STATE.entitlement = val; if(val==='pro')await trackEvent('upgrade_completed'); await persist(); render(); }

function applyTheme(){
  document.documentElement.setAttribute('data-mode', STATE.mode || 'dark');
  document.documentElement.setAttribute('data-accent', isPro() ? (STATE.accentTheme||'default') : 'default');
  const btn = document.getElementById('modeToggle');
  if(btn) btn.textContent = (STATE.mode==='light') ? '🌙' : '☀️';
}
async function toggleMode(){
  STATE.mode = STATE.mode==='light' ? 'dark' : 'light';
  await persist(); applyTheme();
}
async function selectAccent(key){
  if(!isPro()){ paywallTrigger('theme_'+key, {icon:'🎨', title:'Unlock more themes', body:'Additional visual themes are part of Momentum Pro. Upgrade to make Momentum look like yours.'}); return; }
  STATE.accentTheme = key; await persist(); applyTheme(); render();
}

function completionRateForDate(dateStr){
  const activeHabits = STATE.habits.filter(h => {
    const created = daysAgo(h.createdDaysAgo);
    return fmtDate(created) <= dateStr;
  });
  if(activeHabits.length===0) return null;
  let done=0;
  activeHabits.forEach(h=>{ if(STATE.checkins[h.id] && STATE.checkins[h.id][dateStr]) done++; });
  return done/activeHabits.length;
}
function overallMomentumScore(){
  let num=0, den=0, decay=0.9;
  for(let i=0;i<14;i++){
    const rate = completionRateForDate(fmtDate(daysAgo(i)));
    if(rate===null) continue;
    const w = Math.pow(decay,i);
    num += rate*w; den += w;
  }
  return den? Math.round((num/den)*100) : 0;
}
function habitMomentumScore(id){
  const habit = STATE.habits.find(h=>h.id===id);
  if(!habit) return 0;
  const created = fmtDate(daysAgo(habit.createdDaysAgo));
  let num=0, den=0, decay=0.9;
  for(let i=0;i<14;i++){
    const date = fmtDate(daysAgo(i));
    if(created > date) continue;
    const done = (STATE.checkins[id] && STATE.checkins[id][date]) ? 1 : 0;
    const w = Math.pow(decay,i);
    num += done*w; den += w;
  }
  return den ? Math.round((num/den)*100) : 0;
}
function habitStreaks(id){
  const habit = STATE.habits.find(h=>h.id===id);
  if(!habit) return {current:0, best:0};
  let best=0, run=0;
  for(let i=habit.createdDaysAgo;i>=0;i--){
    const d = fmtDate(daysAgo(i));
    if(STATE.checkins[id] && STATE.checkins[id][d]){ run++; best=Math.max(best,run); }
    else run=0;
  }
  let current=0;
  for(let i=0;;i++){
    const d = fmtDate(daysAgo(i));
    if(STATE.checkins[id] && STATE.checkins[id][d]) current++; else break;
  }
  return {current, best};
}
function daysSinceStart(){
  const start = new Date(STATE.accountStart);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now-start)/86400000);
}

async function shouldShowTrigger(id){
  const last = STATE.triggerLog[id];
  if(!last) return true;
  const hrs = (Date.now()-last)/3600000;
  return hrs > CONFIG.triggerCooldownHours;
}
async function markTriggerShown(id){ STATE.triggerLog[id]=Date.now(); await persist(); }

function goto(tab){ currentTab=tab; render(); }

function showModal(html){
  const bd = document.getElementById('modalBackdrop');
  bd.innerHTML = `<div class="modal">${html}</div>`;
  bd.classList.add('show');
  bd.onclick = (e)=>{ if(e.target===bd) closeModal(); };
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }
function upgradeFromModal(){ closeModal(); goto('upgrade'); }

async function paywallTrigger(id, {icon='🔒', title, body}){
  await markTriggerShown(id);
  await trackEvent('paywall_shown', { trigger: id });
  showModal(`
    <div class="lock-icon">${icon}</div>
    <h3>${title}</h3>
    <p>${body}</p>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal()">Not now</button>
      <button class="primary" onclick="paywallClicked('${id}')">See Momentum Pro</button>
    </div>
  `);
}
async function paywallClicked(id){
  await trackEvent('paywall_clicked', { trigger: id });
  upgradeFromModal();
}

async function toggleHabit(id){
  const today = fmtDate(daysAgo(0));
  if(!STATE.checkins[id]) STATE.checkins[id]={};
  if(STATE.checkins[id][today]) delete STATE.checkins[id][today];
  else STATE.checkins[id][today]=true;
  await persist(); render();
}
async function addHabitPrompt(){
  const activeCount = STATE.habits.filter(h=>h.createdDaysAgo>=0).length;
  if(!isPro() && activeCount >= CONFIG.limits.freeMaxHabits){
    paywallTrigger('fourth_habit', {
      icon:'✨',
      title:'Ready to build more?',
      body:`Free accounts include ${CONFIG.limits.freeMaxHabits} active habits. Upgrade to Momentum Pro for unlimited habits.`
    });
    return;
  }
  const name = prompt('New habit name:');
  if(!name) return;
  const id = 'h'+Date.now();
  STATE.habits.push({id, name, emoji:'⭐', createdDaysAgo:0});
  STATE.checkins[id]={};
  await persist(); render();
}

async function editReminder(id){
  const habit = STATE.habits.find(h=>h.id===id);
  if(!habit) return;
  const current = STATE.reminders[id] || '';
  const input = prompt(`Reminder time for "${habit.name}" (24h HH:MM), or leave blank to remove:`, current || '08:00');
  if(input===null) return;
  const trimmed = input.trim();
  if(trimmed===''){ delete STATE.reminders[id]; }
  else if(/^([01]?\d|2[0-3]):[0-5]\d$/.test(trimmed)){
    const [h,m] = trimmed.split(':');
    STATE.reminders[id] = h.padStart(2,'0')+':'+m;
  } else {
    alert('Please use 24-hour HH:MM, e.g. 07:30');
    return;
  }
  await persist(); render();
}
function fmt12h(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const ampm = h>=12 ? 'PM':'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function habitWeekTrend(id){
  const habit = STATE.habits.find(h=>h.id===id);
  const rateForRange = (start,end)=>{
    let done=0, total=0;
    for(let i=start;i<=end;i++){
      const d = fmtDate(daysAgo(i));
      if(fmtDate(daysAgo(habit.createdDaysAgo)) > d) continue;
      total++;
      if(STATE.checkins[id] && STATE.checkins[id][d]) done++;
    }
    return total ? done/total : null;
  };
  return { thisWeek: rateForRange(0,6), lastWeek: rateForRange(7,13) };
}
function showHabitDetail(id){
  const habit = STATE.habits.find(h=>h.id===id);
  if(!habit) return;
  const score = habitMomentumScore(id);
  const {current, best} = habitStreaks(id);

  let cells='';
  for(let i=13;i>=0;i--){
    const d = fmtDate(daysAgo(i));
    const active = fmtDate(daysAgo(habit.createdDaysAgo)) <= d;
    const done = STATE.checkins[id] && STATE.checkins[id][d];
    cells += `<div class="cell" style="background:${!active?'transparent':(done?'var(--accent-2)':'var(--surface-3)')};opacity:${active?1:.25}"></div>`;
  }

  let analysis;
  if(isPro()){
    const {thisWeek, lastWeek} = habitWeekTrend(id);
    const tPct = thisWeek!==null ? Math.round(thisWeek*100) : null;
    const lPct = lastWeek!==null ? Math.round(lastWeek*100) : null;
    let trendLine = 'Not enough history yet to compare weeks.';
    if(tPct!==null && lPct!==null){
      const delta = tPct-lPct;
      trendLine = delta>3 ? `Trending up — ${tPct}% this week vs ${lPct}% last week.`
                : delta<-3 ? `Trending down — ${tPct}% this week vs ${lPct}% last week.`
                : `Holding steady around ${tPct}% completion.`;
    } else if(tPct!==null){
      trendLine = `${tPct}% completion this week — building your baseline.`;
    }
    analysis = `<h3 class="subsection-title" style="margin-top:16px;">Historical analysis</h3>
      <p style="margin:0 0 10px;font-size:12.5px;">${trendLine}</p>`;
  } else {
    analysis = `<div class="locked-overlay" style="margin-top:14px;">
      <span class="lock-icon">🔒</span>
      <div class="h1">See the full story of ${habit.name}.</div>
      <p>Unlock historical analysis for every habit with Momentum Pro.</p>
      <button onclick="closeModal();goto('upgrade')">See Momentum Pro</button>
    </div>`;
  }

  showModal(`
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-size:26px;">${habit.emoji}</div>
      <h3 style="margin:0;">${habit.name}</h3>
    </div>
    <div class="stats-row" style="margin:16px 0 4px;">
      <div class="stat-box"><div class="n">${score}</div><div class="l">Momentum score</div></div>
      <div class="stat-box"><div class="n">${current}d</div><div class="l">Current streak</div></div>
      <div class="stat-box"><div class="n">${best}d</div><div class="l">Best streak</div></div>
    </div>
    <div class="grid-label" style="margin-top:14px;">Last 14 days</div>
    <div class="cellgrid" style="grid-template-columns:repeat(7,1fr);margin-bottom:2px;">${cells}</div>
    ${analysis}
    <div class="btn-row" style="margin-top:18px;">
      <div class="icon-btn" style="width:auto;padding:0 14px;border-radius:12px;" onclick="closeModal();editReminder('${id}')">⏰ Reminder</div>
      <button class="secondary" style="flex:1;" onclick="closeModal()">Close</button>
    </div>
  `);
}

async function selectRange(days){
  if(days>14 && !isPro()){
    const copy = {
      30:{title:'Your Momentum goes further.', body:'Upgrade to Momentum Pro to see your complete 30-day history and how your consistency is changing.'},
      90:{title:'See the bigger picture.', body:'Your habits become more meaningful over time. Unlock your 90-day Momentum Map.'},
      365:{title:'See the year you\'re building.', body:'Unlock your complete yearly Momentum Map and watch your consistency take shape.'}
    }[days];
    await paywallTrigger('range_'+days, {title:copy.title, body:copy.body});
    return;
  }
  currentRange = days; render();
}

function weekAvg(startOffset,endOffset){
  let sum=0, count=0;
  for(let i=startOffset;i<=endOffset;i++){
    const rate = completionRateForDate(fmtDate(daysAgo(i)));
    if(rate!==null){ sum+=rate; count++; }
  }
  return count ? sum/count : null;
}
function bestWeekday(rangeDays){
  const names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const sums=[0,0,0,0,0,0,0], counts=[0,0,0,0,0,0,0];
  for(let i=0;i<rangeDays;i++){
    const d = daysAgo(i);
    const rate = completionRateForDate(fmtDate(d));
    if(rate===null) continue;
    const wd = d.getDay();
    sums[wd]+=rate; counts[wd]++;
  }
  let bestIdx=-1, bestAvg=-1;
  for(let k=0;k<7;k++){ if(counts[k]>0 && sums[k]/counts[k]>bestAvg){ bestAvg=sums[k]/counts[k]; bestIdx=k; } }
  return bestIdx>=0 ? names[bestIdx] : '—';
}
function renderWeeklyReview(){
  if(!isPro()){
    return `<div class="locked-overlay" style="margin-top:14px;">
      <span class="lock-icon">🔒</span>
      <div class="h1">Unlock Weekly Reviews</div>
      <p>Get a personalized look at how your consistency changed week to week.</p>
      <button onclick="goto('upgrade')">See Momentum Pro</button>
    </div>`;
  }
  const thisW = weekAvg(0,6), lastW = weekAvg(7,13);
  const thisPct = thisW!==null ? Math.round(thisW*100) : 0;
  const lastPct = lastW!==null ? Math.round(lastW*100) : 0;
  const delta = thisPct-lastPct;
  const deltaText = delta>0?`▲ +${delta}%`:delta<0?`▼ ${delta}%`:'± 0%';
  return `<h3 class="subsection-title">Weekly Review</h3>
    <div class="score-card" style="margin-bottom:14px;">
      <div class="label">This week's completion</div>
      <div class="value" style="font-size:30px;">${thisPct}<span>%</span></div>
      <div class="sub">${deltaText} vs. last week (${lastPct}%)</div>
    </div>`;
}

function exportData(){
  if(!isPro()){
    paywallTrigger('export', {icon:'📤', title:'Export your data', body:'Data export is a Momentum Pro feature — download your complete habit history anytime, in full.'});
    return;
  }
  const payload = { exportedAt:new Date().toISOString(), habits:STATE.habits, checkins:STATE.checkins };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'momentum-export.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function render(){
  applyTheme();
  document.getElementById('planBadge').textContent = isPro()?'PRO':'FREE';
  document.getElementById('planBadge').className = 'plan-badge'+(isPro()?' pro':'');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===currentTab));
  const main = document.getElementById('main');
  if(currentTab==='today') main.innerHTML = renderToday();
  else if(currentTab==='map') main.innerHTML = renderMap();
  else main.innerHTML = renderUpgrade();
}

function renderToday(){
  const score = overallMomentumScore();
  const elapsed = daysSinceStart();
  let nudge = '';
  if(!isPro() && elapsed>=CONFIG.conversionNudgeAfterDays && elapsed<=CONFIG.limits.freeHistoryDays+2){
    nudge = `<div class="banner" style="margin-bottom:14px;">
      <div class="lockline">You've built ${elapsed} days of Momentum.</div>
      <p>Want to see where it goes next?</p>
      <button onclick="goto('upgrade')">Unlock Full History</button>
    </div>`;
  }
  let rows = STATE.habits.map((h,idx)=>{
    const today = fmtDate(daysAgo(0));
    const done = STATE.checkins[h.id] && STATE.checkins[h.id][today];
    const inactive = !isPro() && idx >= CONFIG.limits.freeMaxHabits;
    let streak=0;
    for(let i=0;;i++){
      const d = fmtDate(daysAgo(i));
      if(STATE.checkins[h.id] && STATE.checkins[h.id][d]) streak++;
      else break;
    }
    const reminder = STATE.reminders[h.id];
    const meta = inactive
      ? 'Inactive — upgrade to resume'
      : `${streak}d streak · Momentum ${habitMomentumScore(h.id)}${reminder? ' · ⏰ '+fmt12h(reminder) : ''}`;
    return `<div class="habit-row ${inactive?'inactive':''}">
      <div class="habit-emoji">${h.emoji}</div>
      <div class="habit-info" ${inactive?'':`onclick="showHabitDetail('${h.id}')" style="cursor:pointer;"`}>
        <div class="habit-name">${h.name}</div>
        <div class="habit-meta">${meta}</div>
      </div>
      ${inactive? '' : `<div class="bell-btn" onclick="event.stopPropagation();editReminder('${h.id}')" title="Set reminder">${reminder?'⏰':'🔕'}</div>`}
      ${inactive? '' : `<div class="check ${done?'done':''}" onclick="event.stopPropagation();toggleHabit('${h.id}')"></div>`}
    </div>`;
  }).join('');

  return `
    ${nudge}
    <div class="score-card">
      <div class="label">Momentum Score</div>
      <div class="value">${score}<span>/ 100</span></div>
      <div class="sub">Weighted from your last 14 days of consistency</div>
    </div>
    <h2 class="section-title">Today</h2>
    ${rows}
    <button class="add-habit-btn" onclick="addHabitPrompt()">+ Add a habit</button>
  `;
}

function renderMap(){
  const elapsed = daysSinceStart();
  const range = currentRange;
  const pills = [14,30,90,365].map(d=>{
    const label = d===365?'Year':d+' Days';
    const locked = d>14 && !isPro();
    return `<div class="range-pill ${currentRange===d?'active':''}" onclick="selectRange(${d})">${label}${locked?'<span class="lock-mark">🔒</span>':''}</div>`;
  }).join('');

  let banner = '';
  if(!isPro()){
    banner = `<div class="banner">
      <div class="head">Your Momentum Map is growing</div>
      <div class="lockline">🔒 Unlock your full history</div>
      <p>You've been building Momentum for ${elapsed} days. Upgrade to see the complete picture.</p>
      <button onclick="goto('upgrade')">See Momentum Pro</button>
    </div>`;
  }

  let recentCells = '';
  for(let i=13;i>=0;i--){
    const rate = completionRateForDate(fmtDate(daysAgo(i)));
    recentCells += cellHtml(rate);
  }

  let lockedPreview = '';
  if(!isPro()){
    let cells='';
    for(let i=0;i<14;i++) cells += `<div class="cell locked"></div>`;
    lockedPreview = `
      <div class="grid-label">Older history</div>
      <div class="cellgrid" style="grid-template-columns:repeat(7,1fr);margin-bottom:10px;">${cells}</div>
      <div class="locked-overlay">
        <span class="lock-icon">🔒</span>
        <div class="h1">There's more to your story.</div>
        <p>Unlock your complete Momentum Map.</p>
        <button onclick="goto('upgrade')">See Momentum Pro</button>
      </div>
    `;
  } else {
    let cells='';
    for(let i=range-1;i>=0;i--){
      const rate = completionRateForDate(fmtDate(daysAgo(i)));
      cells += cellHtml(rate);
    }
    lockedPreview = `
      <div class="grid-label">${range===365?'Full year':range+'-day'} view</div>
      <div class="cellgrid" style="grid-template-columns:repeat(${range>=90?14:7},1fr);">${cells}</div>
    `;
  }

  const basicStreak = (()=>{ let s=0; for(let i=0;;i++){const rate=completionRateForDate(fmtDate(daysAgo(i))); if(rate&&rate>0.5)s++; else break;} return s; })();
  let stats;
  if(isPro()){
    const thisW = weekAvg(0,6), lastW = weekAvg(7,13);
    let trendLabel = '—';
    if(thisW!==null && lastW!==null){
      trendLabel = thisW>lastW+0.03 ? '↑ Improving' : thisW<lastW-0.03 ? '↓ Declining' : '→ Steady';
    } else if(thisW!==null){ trendLabel = '↑ Building'; }
    const bestDay = bestWeekday(Math.min(range,365));
    stats = `
      <div class="stats-row">
        <div class="stat-box"><div class="n">${trendLabel}</div><div class="l">Trend vs. last week</div></div>
        <div class="stat-box"><div class="n">${bestDay}</div><div class="l">Best day of week</div></div>
      </div>`;
  } else {
    stats = `
      <div class="stats-row">
        <div class="stat-box"><div class="n">${basicStreak}d</div><div class="l">Current streak</div></div>
        <div class="stat-box"><div class="n">${Math.round(overallMomentumScore())}%</div><div class="l">14-day completion</div></div>
      </div>`;
  }

  return `
    <h2 class="section-title">Momentum Map</h2>
    <div class="range-select">${pills}</div>
    ${banner}
    <div class="grid-wrap">
      <div class="grid-label">Recent 14 days</div>
      <div class="cellgrid" style="grid-template-columns:repeat(7,1fr);">${recentCells}</div>
    </div>
    ${lockedPreview}
    ${stats}
    ${renderWeeklyReview()}
  `;
}
function cellHtml(rate){
  if(rate===null) return `<div class="cell" style="opacity:.25;"></div>`;
  const alpha = 0.15 + rate*0.85;
  return `<div class="cell" style="background:color-mix(in srgb, var(--accent) ${Math.round(alpha*100)}%, transparent);"></div>`;
}

function renderUpgrade(){
  const p = CONFIG.pricing;
  const cards = Object.entries(p).map(([key,v])=>`
    <div class="pricing-card ${v.best?'best':''}" onclick="mockPurchase('${key}')">
      <div>
        <div class="ptitle">${v.label}${v.best?'<span class="badge-best">BEST VALUE</span>':''}</div>
        <div class="pdesc">${v.desc}</div>
      </div>
      <div class="price">$${v.price}${key==='monthly'?'<small>/mo</small>':key==='annual'?'<small>/yr</small>':'<small>once</small>'}</div>
    </div>
  `).join('');

  const themeRows = Object.entries(CONFIG.themes).map(([key,t])=>{
    const locked = !t.free && !isPro();
    const active = (isPro()?STATE.accentTheme:'default')===key;
    return `<div class="pricing-card ${active?'selected':''}" onclick="selectAccent('${key}')">
      <div><div class="ptitle">${t.name}${locked?' 🔒':''}</div><div class="pdesc">${t.free?'Included free':'Momentum Pro theme'}</div></div>
      <div class="swatch" style="background:${t.swatch};border-color:${active?'var(--text)':'transparent'};"></div>
    </div>`;
  }).join('');

  return `
    <h2 class="section-title">Momentum Pro</h2>
    <div class="score-card" style="margin-bottom:16px;">
      <div class="label">Unlock the full picture</div>
      <div class="value" style="font-size:24px;color:var(--text);">Your entire history,<br>always yours.</div>
    </div>
    ${cards}
    <div class="pricing-card" onclick="exportData()">
      <div><div class="ptitle">Export my data</div><div class="pdesc">Download your complete habit history as JSON</div></div>
      <div class="price" style="font-size:16px;">${isPro()?'⬇':'🔒'}</div>
    </div>
    <button class="restore-link" onclick="restorePurchases()">Restore purchases</button>
    <ul class="feature-list">
      <li>Unlimited active habits</li>
      <li>Full historical Momentum Map — 30/90/year/all-time</li>
      <li>Advanced statistics & habit-level trend analysis</li>
      <li>Weekly reviews & data export</li>
      <li>Additional visual themes</li>
      <li>Restore purchases across devices</li>
    </ul>
    <h3 class="subsection-title">Appearance</h3>
    ${themeRows}
    <div class="dev-toggle">
      Developer test switch — mocked entitlement (no real purchase). Real App Store / Play Billing purchases are a separate milestone.
      <div class="row">
        <span>Simulate Pro access</span>
        <div class="switch ${isPro()?'on':''}" onclick="setEntitlement('${isPro()?'free':'pro'}')"></div>
      </div>
    </div>
  `;
}
function mockPurchase(tier){
  showModal(`
    <div class="lock-icon">🎉</div>
    <h3>Simulated purchase</h3>
    <p>In production this calls the App Store / Play Billing flow for the <b>${CONFIG.pricing[tier].label}</b> plan ($${CONFIG.pricing[tier].price}), then grants the <code>${CONFIG.entitlementKey}</code> entitlement on receipt validation. For this prototype, use the dev switch below to simulate it instead.</p>
    <div class="btn-row"><button class="primary" onclick="closeModal()">Got it</button></div>
  `);
}
function restorePurchases(){
  showModal(`
    <div class="lock-icon">🔄</div>
    <h3>Restore purchases</h3>
    <p>In production this re-queries the App Store / Play Billing receipt for this account and re-grants <code>${CONFIG.entitlementKey}</code> if an active subscription or lifetime purchase is found — no new charge. Use the dev switch on the Pro tab to simulate an already-entitled account in this prototype.</p>
    <div class="btn-row"><button class="primary" onclick="closeModal()">Got it</button></div>
  `);
}

/* ============ BOOT ============ */
(async function(){
  await initState();
  applyTheme();
  render();
})();
</script>
